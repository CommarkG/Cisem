# ── functional-check.mjs RESULT (FE-I11 presence≠behavior gate, run 2026-07-21) ──
# `node frontend/tests/functional-check.mjs` → real run, jsdom present (frontend/tests/node_modules installed):
#   RESULT: 600 pass, 0 fail — "ALL INTERACTIVE ELEMENTS BEHAVIORALLY VERIFIED"
#   COVERAGE: the harness's ALL_PAGES loop = fs.readdirSync(frontend/pages) — this covers all 27 pages/*.html
#   (wiring_state: LIVE above). It does NOT load or test frontend/index.html (confirmed: zero reference to
#   "index.html" anywhere in functional-check.mjs) — hence index.html above is wiring_state: ACCESSIBLE, not
#   LIVE (honest; behavior claimed only where a behavioral test actually ran it). See gaps: below.

gaps:
  # 1. Orphan-page check (A1 nothing stands alone) — REAL FINDING: none found.
  orphans: []
  orphans_note: >
    Checked frontend/index.html <a href> targets against the 27 pages/*.html files (grep-diffed, whole
    class) — every one of the 27 IS linked from index.html's nav/grid. No orphan pages exist today. This
    is a genuinely clean result, not a gap; recorded for completeness per the task's ask.

  # 2. Behavioral-test coverage gap (FE-I11) — REAL FINDING.
  behavioral_coverage_gap:
    - page: "index.html"
      finding: >
        frontend/tests/functional-check.mjs enumerates ONLY frontend/pages/*.html (via readdirSync on that
        one directory); frontend/index.html lives one level up and is never loaded or asserted, despite
        carrying its own interactive Grid/List view toggle (the exact element-class FE-I11 exists to gate).
      class_level_prevention: >
        CLASS: FE-I11's ALL_PAGES enumeration is not truly universal-by-default (Principle 18-B) — it is
        scoped to one subdirectory instead of the whole frontend/**/*.html class. PREVENTION: widen the
        existing enumeration (fs.readdirSync(frontend/pages) → also load ../index.html, or glob frontend
        recursively) rather than add a second narrow check. Routed to dna/learning-registry/agent-findings.md
        this run for RIPL distillation; Opus to fold into CS-FRONTEND-001 FE-I11 wording + functional-check.mjs.
      status: OPEN-ROUTED

  # 3. Vocabulary gaps (CORE-SEED 1 — named, never invented) — REAL FINDINGS.
  vocabulary_gaps:
    - gap: "Status enum missing PREVIEW"
      detail: >
        4 pages use/reference "PREVIEW" as a page state (dynamic-menu.html, gallery.html, uxui.html — inline
        HTML comment "Status: PREVIEW / DRAFT"; schema.html — only in commit message a97edf0, not inline).
        CISEM-VOC-00002's Node Status enum is DRAFT|PROPOSED|DECLARED|RATIFIED|PLACEHOLDER|SCHEDULED|SPLIT|
        PROVISIONAL-ACTIVE — PREVIEW is NOT a member. Meanwhile CISEM-VOC-00001 DOES list "preview" as a
        page-kind TAG value, which conflates a lifecycle-state word with a kind-tag word. Per CORE-SEED 1,
        this registry recorded the enum-safe DRAFT (the other half of the inline "PREVIEW / DRAFT" pair) and
        flags PREVIEW here rather than inventing/adding it silently. Needs Opus/Governor: either add PREVIEW
        to the VOC-00002 Node Status enum (distinct from PROVISIONAL-ACTIVE), or rule that pages should say
        "PROVISIONAL-ACTIVE" instead of "PREVIEW" and correct the 3 inline HTML comments (would be an HTML
        edit — out of this registry's low-blast scope; a follow-on for whoever owns the ratification).
    - gap: "page_kind missing a help/utility category"
      detail: >
        help.html has no clean VOC-00001 page-kind fit (page/dashboard/index/gallery/dynamic-menu/schema-view/
        admin/preview). Recorded as generic "page" (the catch-all value) pending a possible dedicated "help" or
        "utility" kind.
    - gap: "page_kind missing a catalog/listing category distinct from index"
      detail: >
        21 of 28 pages are catalog/listing surfaces for a governed-artifact TYPE (agents, axioms, corespines,
        document-types, engines, front-page-types, internal-audits, internal-file-types, learning-loops, nodes,
        pipelines, principles, processes, protocols, qc, rules, skills, templates, vocabulary, wizards). All 21
        collapse into the single generic "page" value because VOC-00001 has no dedicated "catalog"/"listing"
        kind distinct from the root "index" — flattening a meaningful distinction (root home vs artifact-type
        catalog). Naming this for Opus/Governor consideration.
    - gap: "uxui.html page_kind is a stretch-fit"
      detail: >
        Classified as "dashboard" (closest existing value) but it is really a design-system/platform-DNA
        overview page — no exact VOC-00001 match exists.

  # 4. Pages still PREVIEW awaiting Governor acceptance — REAL FINDING (from COMPACT STATE v9 + inline markers).
  preview_awaiting_governor:
    - dynamic-menu.html   # inline "PREVIEW / DRAFT"; per WITNESS v9, awaiting tier/responsive differentiation
    - gallery.html        # inline "PREVIEW / DRAFT"; per WITNESS v9, awaiting Governor acceptance
    - uxui.html           # inline "PREVIEW / DRAFT"; per WITNESS v9, awaiting Governor acceptance
    - schema.html         # PREVIEW per commit a97edf0 message ONLY — page itself has no inline header (see
                           #   vocabulary_gaps + behavioral_coverage_gap notes); a header-propagation gap.

  # 5. Header-compliance gap — THE CENTRAL FINDING this registry exists to surface.
  header_compliance:
    pages_with_inline_header: 3    # dynamic-menu.html, gallery.html, uxui.html
    pages_without_inline_header: 25
    total_pages: 28
    finding: >
      Only 3 of 28 frontend pages (11%) currently carry an inline <!-- tags: --> / <!-- Status: --> HTML-
      comment header on disk. This IS the compliance gap the Governor directive ("every CISEM frontend page
      must now carry tags + statuses") was aimed at surfacing. This registry catalogs the CURRENT reality;
      it does not itself add headers to any page (CORE-SEED 2 — no HTML edits).
      CLASS-LEVEL PREVENTION (Principle 17): any NEW frontend page should be required, at creation, to carry
      an inline tags:/Status: header — extend dna/checks/creation-gate.sh (or a new FE-invariant under
      CS-FRONTEND-001) to check for it specifically on frontend/**/*.html, so page #29 does not silently join
      the 25 that lack one. Routed to dna/learning-registry/agent-findings.md this run.
    status: OPEN-ROUTED
