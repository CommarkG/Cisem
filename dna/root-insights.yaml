# CISEM Root-Insights / Weekly-Prevention Registry
# Governed by: CLAUDE.md §2 Principle 17 (PREVENTION-FIRST) + ARCH-00406 (RIPL-v2 weekly batch)
# Status: ACTIVE (created 2026-07-20) | tags: [prevention, root-insight, ripl, weekly-batch, monotonic]
#
# PURPOSE: the accumulation buffer for PREVENTIONS. Every error/gap/problem noticed by any tier
# (Opus/Sonnet/Haiku) is routed here with its CLASS-level prevention — not just a local patch.
# The RIPL WEEKLY BATCH (ARCH-00406) clusters these, finds cross-domain patterns, distinguishes a true
# root-cause from a local event, and promotes mature ones into hardwired guards (checks/hooks/principles).
# MONOTONIC: append-only; a prevention leaves only by being PROMOTED to a wired guard (record the promotion).
#
# STATUS values: PARKED (captured, awaiting weekly batch) · CLUSTERED (grouped in a batch) ·
#   PROMOTED (became a wired guard — cite it) · SUPERSEDED (replaced by a better prevention).

