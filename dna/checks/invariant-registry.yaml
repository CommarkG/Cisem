# CISEM Invariant Registry — context-envelope schema (ARCH-00392 Phase 0)
# PURPOSE: machine-readable scope envelope per invariant so plan-audit.sh emits
#          PASS / FAIL / UNKNOWN (three states) instead of binary PASS/FAIL.
# READ BY: dna/checks/plan-audit.sh (v6 — presence check + grep for key patterns)
# SSOT NOTE: invariant CONTENT lives in ARCH-00320 / CLAUDE.md. This file carries
#            SCOPE ENVELOPE ONLY — legal_kind, applies_to, silent_on, core[], penumbra[].
#            NEVER duplicate invariant rules here (A8/I10/I19 — no fork).

I19:
  label: "Existing-First search (§3.2b, plan gate)"
  legal_kind: RULE
  applies_to:
    - "any plan file (dna/planning/CISEM-ARCH-*.md)"
    - "any protocol file (dna/protocols/CISEM-ARCH-*.md) introducing a new protocol"
  silent_on:
    - "IBD raw-capture files (dna/ibd/IBD-*) — capture-first by design, gate-exempt"
    - "HANDOFF files — pre-node coordination artifacts, not governed creation"
    - "retro-plan files that explicitly document a retroactive search result inline"
  core:
    - "plan has 'Existing-First' AND cites at least one registry/grep/archive result explicitly"
  penumbra:
    - "plan mentions 'Existing-First' but lists NO registries, grep, or search results"
    - "plan says 'nothing found' without naming what was searched"
  check_pattern: "grep -qiE 'ssot-registry|corespine-registry|naming-registry|grep|archive|PROMOTES|IBD-[0-9]+|nothing found|no existing|SUPERSEDES'"

I23:
  label: "EXISTS≠ACTIVE — activation claims require disk-verifiable mechanism"
  legal_kind: RULE
  applies_to:
    - "any line claiming a mechanism is 'live', 'wired', 'active', 'enforced', or 'blocking'"
    - "hook-related claims (PreCompact, SessionStart, SessionEnd, pre-commit)"
  silent_on:
    - "Governor decree claims — ratification is Governor's act, not a mechanism file"
    - "lines that explicitly say 'NOT-YET-BUILT', 'PLACEHOLDER', or 'PENDING'"
    - "descriptive or historical text not asserting current activation"
  core:
    - "activation claim cites a specific file that exists AND session hooks registered in settings.json"
  penumbra:
    - "hook files exist in .claude/hooks/ but are NOT registered in .claude/settings*.json"
    - "activation claim cites a file that exists but specific registration path is absent"
  check_pattern: "grep -rqiE '<hook_basename>' .claude/settings*.json"

I24:
  label: "RATIFIED requires validation evidence (no premature promotion — DIOS anti-pattern)"
  legal_kind: RULE
  applies_to:
    - "any node file with 'Status: RATIFIED' in frontmatter (dna/**/*.md)"
    - "any registry entry with 'status: RATIFIED'"
  silent_on:
    - "pre-node files (IBD/HANDOFF/BP/queue/) — they do not carry RATIFIED status"
    - "nodes with explicit Governor decree citation including date AND quality-ledger reference"
  core:
    - "RATIFIED node has decree citation + specific date (YYYY-MM-DD) or quality-ledger run reference"
  penumbra:
    - "RATIFIED with 'per Governor' or authorization word but NO date (YYYY-MM-DD) and NO run reference"
    - "RATIFIED status added without any attribution in the file"
  check_pattern: "grep -qiE '[0-9]{4}-[0-9]{2}-[0-9]{2}|run [0-9]+|quality.ledger'"
