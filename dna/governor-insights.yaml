  - { id: GI-50, group: consolidation_and_ssot, insight: "TSA RETIRED (un-migrated genesis term, never defined, not load-bearing). Pocket RESOLVED-BY-POINTER → ai-pocket-mechanism.md (the founding-sense placeholder was a phantom; the mechanism is the real definition). FOUND-00001 founding slots now all settled (CoreSpiral filled · TSA retired · Pocket pointed).", home: "FOUND-00001 founding slots", status: RATIFIED, date: 2026-07-20 }
  - { id: GI-60, group: collaboration_and_governance, insight: "WELL-GOVERNED DIVERSITY IS A TREASURE (Governor decree 2026-07-22): external/new-blood approaches (Brain, Haiku online research, Gemini/GPT) — quarantined + PURIFIED (ARCH-00399) — are a deliberate hedge against internal re-derivation/misdiagnosis (Opus reasoning from inside its own frame, the recurring root). Diversity WITHOUT governance = pollution; WITH governance = treasure. Feeds the two-strikes escalation ladder (EXTENDS GI-34). AXIOM A12 candidate — pending Brain consult + Governor ratification.", home: "brain-consult-escalation-protocol · extends GI-34 · ARCH-00399 · axiom A12 candidate", status: DECREED-NOT-YET-WIRED, date: 2026-07-22 }
  - { id: GI-62, group: collaboration_and_governance, insight: "ALL GOVERNOR INPUTS ARE PENDING-BY-DEFAULT (decree 2026-07-22): treat every instruction/request as a PENDING ISSUE to be captured then processed CALMLY with Brain+Governor to CONSENSUS, then ratified — NEVER auto-executed. The Governor's HARSH/URGENT wording = EMPHASIS of importance + a signal he does not yet trust the AI to reliably park+process; it is NOT a command to rush or skip gates. Default posture = capture (never drop), process calmly, consensus-then-ratify. EXTENSION of Principle 20 per Brain (2026-07-22): tone != authorization — from TERSENESS to EMOTIONAL-INTENSITY/URGENCY as the SAME false skip-the-gate signal; ONE rule about tone!=authorization, not two adjacent ones (A8 anti-drift). Also consolidates GI-03 (consensus-before-creation) + Principle 9 (silence!=resolution) + §2.7 park-by-demand; ADDS the harsh-words=emphasis-not-rush nuance. Captured-pending Brain+Governor consensus (no solo ratify, GI-63).", home: "EXTENDS Principle 20 (tone!=authorization); consolidates GI-03/P9/§2.7; CLAUDE.md constitution-wiring is the follow-on", status: RATIFIED (Governor direct 2026-07-22; wiring follows), date: 2026-07-22 }
  - { id: GI-63, group: collaboration_and_governance, insight: "NO SOLO RATIFICATION OF DEEP-CORE (decree 2026-07-22, 'engrave'): a deep/core issue — axioms, foundational governance, anything constitution-level — is NEVER ratified by ONE participant, not even the Governor alone. Requires multi-party CONSENSUS (Governor + Brain + Opus) before RATIFIED/axiom status. Extends ARCH-00190 double-ratification (Opus soundness + Governor authority) by adding Brain-in-the-loop for deep-core + forbidding ANY solo stamp. Guards single-frame error on the highest-blast changes. PRECISION (Brain 2026-07-22): does NOT reduce the Governor's SOLE ratification authority — he holds the ONLY pen; this is the Governor VOLUNTARILY binding himself on WHEN to exercise it (not signing alone on deep-core before HEARING Brain+Opus). CONSENSUS != majority-vote; NO transfer of authority. SELF-APPLIES: this very decree, GI-62, and the 70%/diversity axiom candidates are all captured-pending, not solo-ratified.", home: "extends ARCH-00190 ratification; FOUND-00001 axiom-process; CLAUDE.md wiring pending consensus", status: DECREED-NOT-YET-WIRED, date: 2026-07-22 }
  - { id: GI-65, group: collaboration_and_governance, insight: "DEFAULT OPERATING PROTOCOL (Governor decree 2026-07-22): (1) Opus<->Brain CONSULT BY DEFAULT on everything, strive to CONSENSUS; (2) ask the GOVERNOR only on CORE INTERSECTIONS (his intent / irreversible / a cross-cutting fork Opus+Brain cannot resolve without him); (3) once Opus+Brain reach consensus, BRAIN PRESENTS all pending issues to the Governor — WITH background, each topic BY ITSELF, in SIMPLE words, with PROS/CONS/RECOMMENDATION (the Governor listens to Brain's content — works better for him); (4) the Governor decides per-topic; (5) Brain then packages each decision into a ONE-CLICK copy prompt for CISEM to execute. Opus role shifts: do the consensus work + prepare the BRIEFING PACKAGE (issue + background + joint Opus/Brain position + PCR) for Brain to present; receive Brain's one-clicks and build. Reshapes the relay topology; consolidates PCR (Principle 10) + consensus-before-creation (GI-03) + one-click discipline (I21) + presentation-preferences. Calibration point: what counts as a 'core intersection' (start: intent/irreversible/unresolvable-fork).", home: "collaboration topology; CLAUDE.md + presentation-preferences memory; wiring pending consensus", status: DECREED-NOT-YET-WIRED, date: 2026-07-22 }
  - { id: GI-64, group: collaboration_and_governance, insight: "ASK ON DRAMATIC — do NOT feel obligated to 'get it by myself' (Governor decree 2026-07-22): when an ask is DRAMATIC/consequential/high-blast, ASKING is the MOST PROFESSIONAL move, not a weakness — surface it, clarify, seek consensus BEFORE solo-executing or solo-figuring-it-out. SCOPED BY BLAST (reconciles with 'decide-don't-offer-menus' + guardian own-the-call, which govern ROUTINE/low-blast/in-flow decisions): consequence is the dial — low-blast → decide+act (no menu-dump); high-blast/dramatic/irreversible → ASK. Ties depth D1/D2/D3 + A11 (consult-before-produce) + GI-62 (pending-by-default). Counters the over-autonomy / plausibility-completion reflex.", home: "persona SSOT CS-AI-PROFILING-001 (L2 engraving is the follow-on); reconciles decide-don't-menu", status: RATIFIED (Governor direct 2026-07-22; persona-wiring follows), date: 2026-07-22 }
  - { id: GI-61, group: design_rigor_and_verification, insight: "70% ALLOCATION HEADROOM (Governor decree 2026-07-22, 'engrave into cisem'): plan every resource allocation at 70% of estimate — token budget, agent-attempt count, time — reserving 30% buffer for spikes + mis-estimation. Stretching to 100% is FAKE efficiency that ignores our inability to anticipate what will happen; the buffer IS what yields a stable high-quality outcome. DISTINCT from IBD-0017 P4 (a 70%-token-REDUCTION external tool — different concept, naming-collision avoided per A8). AXIOM candidate — pending consult; governs tokens/agent-attempts/time (named, per Brain's precision requirement).", home: "capacity-planning · brain-consult-escalation-protocol Q4 · axiom candidate", status: DECREED-NOT-YET-WIRED, date: 2026-07-22 }
  - { id: GI-66, group: creation_quality_and_completeness, insight: "MATURITY-DRIVEN COMPLETION (Governor decree 2026-07-23, 'nurture maturity in CISEM'): when a GROUP/CLUSTER of topics reaches MATURITY — 'autonomous completion', i.e. enough consensus + settled design that it can become a ratifiable PLAN and be implemented — it becomes CLEAR HIGH PRIORITY. Drive it: make the required progress until the point where the still-open sub-issues need MORE processing than the plan needs them, THEN PART those sub-issues (park — registered, A10 parking!=losing) and FOCUS on COMPLETING the plan. RATIONALE (both matter): (1) decrease ever-evolving CONTEXT PRESSURE — a shipped mature cluster leaves working memory; (2) REAP THE FRUITS of improving ideas (real implemented value), NOT just intellectual satisfaction from endless discussion. MATURITY is a NURTURED, first-class JUDGMENT axis (not a rigid gate) letting ORCHESTRATORS make OPTIMAL NON-RIGID decisions (A6): the orchestrator reads a cluster's ripeness and decides WHEN to stop processing peripheral sub-issues and start shipping — vs a rigid rule forcing either endless discussion or premature planning. Distinguish 'mature-for-a-PLAN' (implement now) from 'mature-for-GENERALIZATION/sealing' (Principle 15's higher flawless-flow bar). Cross-refs: Principle 9 (completion, silence!=resolution) · A10 (progress+harvest, parking!=losing) · §2.7 (park-by-demand + SWIFT) · A6 (context-over-rigidity) · GI-05 (resolve-by-doing) · GI-43 (Cc# minimal-maturity-to-be-born). Operationalization (Opus first-cut, routed to Brain-consensus then plan): a MATURITY status/axis on clusters; the ripeness-read applies at the queue/threshold routing (§2.7), the harvest-loop drain M2-classification, the accountability board priority-rank, and the Opus->Brain->Governor operating protocol (when to stop consulting and present a plan).", home: "CLAUDE.md Principle 9 + A6/A10 + §2.7; operationalization routed to Brain-consensus->plan; wiring follows", status: "RATIFIED (Governor direct 2026-07-23); operationalization + wiring follow", date: 2026-07-23 }
  - { id: GI-69, group: creation_quality_and_completeness, insight: "COMPLETION-PUSH FIRST (Governor decree 2026-07-24, 'hardwire this... change that dramatically NOW'): LEAD every reply by driving the DECIDED/RATIFIED/not-yet-done items to DONE — actually DO them this turn, never merely 'update' their status. Reporting a decided item as 'decided but not-yet-done' and moving on — treating it low-priority, or deferring under capacity-caution/'I will do it next' — is the named DEFER-DECIDED-AS-UPDATE anti-pattern (a self-instance of Principle 21 applied to the Governor's OWN decisions; a FAILURE, not caution). A decided/ratified item gets DONE now OR an explicit registered park (id+status+reason) — never a soft 'later'. Capacity is managed by FINISHING + harvesting, not by parking decided work. Born from the Governor's sharp catch that Opus 'stops after several things and just updates, acting as if completion has low importance.' Self-catch: 'is anything decided/ratified sitting un-done that I am about to just report?'", home: "persona-collaborator.md L2 (WIRED 2026-07-24) + extends Principle 9/11/14/21", status: "RATIFIED (Governor direct 2026-07-24); persona leg WIRED", date: 2026-07-24 }
  - { id: GI-70, group: creation_quality_and_completeness, insight: "PREVENTION+PRESERVATION EVERY TURN, REAL NOT DECLARED (Governor decree 2026-07-24, 'I insist you mention permanent prevention each turn... your honesty is worth nothing if it does not make real measurable impact'): every turn EXTRACT the class-level prevention (the standing rule stopping the whole class) AND preserve the confirmed good (route the win to its durable home), and STATE it plainly. A declaration/apology is worth NOTHING without real, measurable, PERMANENT impact — the admission counts ONLY once the prevention is ROUTED to root-insights + a mechanical path AND the preservation is on disk. Never be satisfied with admitting/apologizing. Extends Principle 17 + GI-69. Self-catch: 'did I route a REAL prevention this turn, or just confess?'", home: "persona-collaborator.md L2 (WIRED 2026-07-24) + Principle 17", status: "RATIFIED (Governor direct 2026-07-24); persona leg WIRED", date: 2026-07-24 }
  - { id: GI-71, group: creation_quality_and_completeness, insight: "SMART OPTIMIZED COMPLETION over NEW/EXPANDING inputs; PARKING HARDCODED, not AI-debatable (Governor decree 2026-07-24, 'we prefer smart optimized completion over new inputs or expanding ones... wire parking but have it all hardcoded, not debatable by AI'): prefer completing+optimizing EXISTING work over accepting new/expanding inputs. Parking a non-essential new/expanding input is MECHANICAL + NOT AI-debatable — it PARKS (registered, full context, A10) unless genuinely essential or Governor-directed. The AI may not talk itself into processing-now. Consolidates §2.7 park-by-demand + Principle 16 anti-scatter into a HARDCODED default (removes AI discretion to expand).", home: "persona-collaborator.md L2 (WIRED 2026-07-24) + §2.7 + Principle 16; hardcode via intake/threshold default (park-unless-essential)", status: "RATIFIED (Governor direct 2026-07-24); persona leg WIRED", date: 2026-07-24 }
  - { id: GI-72, group: design_rigor_and_verification, insight: "7-DAY EVENT-TRIGGERED CADENCE RATIFIED (Governor 'i yariv ratify the 7 days instead of friday' 2026-07-24): weekly cadences (freshness-check, RIPL/weekly-evolve drain, Brain-CISEM insight exchange) fire on an EVENT ('if >7 days since last run, fire at the next commit / session-start / pre-compact boundary'), NOT a wall-clock schedule. WHY: Claude Code cron here is SESSION-ONLY (dies on exit; ENABLE_TASKS=0; local vscode — no cloud Routines), verified 2026-07-24. A Friday-07:00 clock would be a false promise. Event-trigger tracks ACTIVITY + needs no scheduler.", home: "CAL hooks (>7-day check at pre-commit/session-start/pre-compact); scheduling-capability-finding; ARCH-00417 S1/S2 + ARCH-00406 P1 constraint", status: "RATIFIED (Governor direct 2026-07-24); wiring = CAL >7-day event-check (buildable)", date: 2026-07-24 }
  - { id: GI-68, group: design_rigor_and_verification, insight: "MANDATORY DUAL-TIER PLAN REVIEW + OPUS VALUE-ASSESSMENT (Governor decree 2026-07-23): every plan gets a MANDATORY independent review by BOTH cisem-sonnet (design/implementability lens) AND cisem-haiku (protocol/evidence lens) BEFORE Governor ratification; Opus then ASSESSES whether each review's findings are VALUABLE — filters noise, accepts the real ones, revises the plan. WHY (proven the same turn it was decreed): a single-model pass — even Opus's own Stage-1 — misses real gaps; Opus stamped ARCH-00417 'SOUND', the mandated Sonnet review then found genuine M1-measurability (no WIRED/CLOSED enum exists to measure) + spec-of-record dependency gaps the solo pass missed. EXTENDS GI-17 (two-model verify for checklist/agent changes) + the persona 'two orthogonal review lenses' + P5 Independent Verifier — makes dual-tier review MANDATORY on EVERY plan (not only checklist/agent changes), with Opus as the value-filter (not a rubber-stamp of the reviews either). Ties GI-63 (no solo deep-core) at plan scale. FIRST APPLICATION: ARCH-00417 (dual review found B1/B2/B3 before ratification).", home: "ARCH-00190 §3 + /cisem-plan wizard Step 2 (add the dual-review gate); extends GI-17; CLAUDE.md wiring follows", status: "RATIFIED + WIRED: .claude/skills/cisem-plan/SKILL.md Step 2.3 (ARCH-00433 STEP 5, 2026-08-08; Opus stamp, I7)", date: 2026-07-23 }
  - { id: GI-67, group: collaboration_and_governance, insight: "OPERATING-PROTOCOL REFINEMENT (Governor decree 2026-07-23; EXTENDS GI-65, does not fork): (1) the dialogue is MAINLY Opus<->Brain — calmly EXPLORE options, LEARN TOGETHER, reach CONSENSUS; only ONCE consensus is reached present ALL with PCR for the Governor to ratify-or-remark. (2) EXCEPTION the Governor must take: issues WITHOUT clearance that require a DECISION UNDER UNCERTAINTY which Opus+Brain cannot resolve — the Governor decides those (accepting the uncertainty) SO the two can move on to consensus; a NAMED core-intersection type sharpening GI-65(2)+GI-64 (this is the ONE class Opus escalates mid-consensus rather than solving alone). (3) a PLAN MAY be presented for ratification EVEN WITH pending unresolved sub-issues — a plan need NOT have every sub-issue consensus'd; present the plan, NAME the still-open sub-issues, PARK them (A10). Pairs with GI-66: when a cluster matures to plan-ready, present the plan and PART the unresolved rather than block the plan on them.", home: "EXTENDS GI-65 (default operating protocol) + GI-64; CLAUDE.md wiring follows", status: "RATIFIED (Governor direct 2026-07-23); wiring follows", date: 2026-07-23 }
