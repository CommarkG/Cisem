  - { id: GI-60, group: collaboration_and_governance, insight: "WELL-GOVERNED DIVERSITY IS A TREASURE (Governor decree 2026-07-22): external/new-blood approaches (Brain, Haiku online research, Gemini/GPT) — quarantined + PURIFIED (ARCH-00399) — are a deliberate hedge against internal re-derivation/misdiagnosis (Opus reasoning from inside its own frame, the recurring root). Diversity WITHOUT governance = pollution; WITH governance = treasure. Feeds the two-strikes escalation ladder (EXTENDS GI-34). AXIOM A12 candidate — pending Brain consult + Governor ratification.", home: "brain-consult-escalation-protocol · extends GI-34 · ARCH-00399 · axiom A12 candidate", status: DECREED-NOT-YET-WIRED, date: 2026-07-22 }
  - { id: GI-62, group: collaboration_and_governance, insight: "ALL GOVERNOR INPUTS ARE PENDING-BY-DEFAULT (decree 2026-07-22): treat every instruction/request as a PENDING ISSUE to be captured then processed CALMLY with Brain+Governor to CONSENSUS, then ratified — NEVER auto-executed. The Governor's HARSH/URGENT wording = EMPHASIS of importance + a signal he does not yet trust the AI to reliably park+process; it is NOT a command to rush or skip gates. Default posture = capture (never drop), process calmly, consensus-then-ratify. Consolidates GI-03 (consensus-before-creation) + Principle 9 (silence!=resolution) + Principle 20 (terse/tone != gate-bypass) + §2.7 park-by-demand; ADDS the harsh-words=emphasis-not-rush nuance. Captured-pending Brain+Governor consensus (no solo ratify, GI-63).", home: "consolidates GI-03/P9/P20/§2.7; CLAUDE.md wiring pending consensus", status: DECREED-NOT-YET-WIRED, date: 2026-07-22 }
  - { id: GI-63, group: collaboration_and_governance, insight: "NO SOLO RATIFICATION OF DEEP-CORE (decree 2026-07-22, 'engrave'): a deep/core issue — axioms, foundational governance, anything constitution-level — is NEVER ratified by ONE participant, not even the Governor alone. Requires multi-party CONSENSUS (Governor + Brain + Opus) before RATIFIED/axiom status. Extends ARCH-00190 double-ratification (Opus soundness + Governor authority) by adding Brain-in-the-loop for deep-core + forbidding ANY solo stamp. Guards single-frame error on the highest-blast changes. SELF-APPLIES: this very decree, GI-62, and the 70%/diversity axiom candidates are all captured-pending, not solo-ratified.", home: "extends ARCH-00190 ratification; FOUND-00001 axiom-process; CLAUDE.md wiring pending consensus", status: DECREED-NOT-YET-WIRED, date: 2026-07-22 }
  - { id: GI-61, group: design_rigor_and_verification, insight: "70% ALLOCATION HEADROOM (Governor decree 2026-07-22, 'engrave into cisem'): plan every resource allocation at 70% of estimate — token budget, agent-attempt count, time — reserving 30% buffer for spikes + mis-estimation. Stretching to 100% is FAKE efficiency that ignores our inability to anticipate what will happen; the buffer IS what yields a stable high-quality outcome. DISTINCT from IBD-0017 P4 (a 70%-token-REDUCTION external tool — different concept, naming-collision avoided per A8). AXIOM candidate — pending consult; governs tokens/agent-attempts/time (named, per Brain's precision requirement).", home: "capacity-planning · brain-consult-escalation-protocol Q4 · axiom candidate", status: DECREED-NOT-YET-WIRED, date: 2026-07-22 }
