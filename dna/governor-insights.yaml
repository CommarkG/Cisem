  - { id: GI-59, group: creation_quality_and_completeness, insight: "BOUNDARY-SURVIVAL ARTIFACTS (hardwired into pre-compact hook): when in-flight design/process work is open, before compaction produce (1) FIDELITY record (Governor asks + Opus understanding), (2) PROCESS-CONTEXT file (design+reasoning+nuances), (3) RESUME PROMPT with links — because compaction distorts INTENT. Compaction itself is not Opus-controllable; these files are the counter.", home: ".claude/hooks/pre-compact.sh + Principle 12/13 + A10", status: RATIFIED-WIRED, date: 2026-07-21 }
