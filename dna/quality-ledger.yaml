metrics:
  invariants_total: 13
  invariants_added_last_7_runs: 6         # I8..I13 — the loop keeps learning
  checks_refined: 1                        # run 4 improved the gate instead of adding an invariant
  recurrence_count: 0                      # no resolved finding has re-appeared
  open_disclosed:
    - founding-node (I8, P0 — needs Governor/Drive source)
    - CS-MASTER-VALIDATION-001 ratification (drafted, awaiting foundational decree)
    - ARCH-00280 Q4 (template two-level question)

target:
  recurrence_rate: 0                      # a resolved finding must never return
  invariants_added_per_run: DECLINING     # fewer NEW failure classes over time = maturing
  note: >
    A rising invariants_added_per_run means we keep discovering new failure
    CLASSES — immature. A declining trend toward zero means the invariant set
    is becoming complete. That trend is the single health metric of the cycle.
