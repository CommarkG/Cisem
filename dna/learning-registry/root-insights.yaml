  RI-0042:
    date: "2026-07-26"
    trigger: "Governor caught a subagent (cisem-sonnet) spinning: it launched plan-audit.sh in the BACKGROUND, then re-Read the same output file 6+ times while polling for completion — near-identical reads, zero state change. 'looks like a loop - is it?'"
    root_insight: >
      RUNAWAY-LOOP CLASS (the 'agent runs all night' failure): an agent that launches a slow
      background command and POLLS its output by re-reading — or more generally repeats a
      near-identical (tool + args) action with no new information — burns tokens/wall-clock
      indefinitely with no progress. Two distinct sub-fixes:
      (A) IMMEDIATE (behavioral, cheap): a subagent must NEVER poll a background command's output;
          run checks SYNCHRONOUSLY (foreground, with a timeout) or don't run them in the agent at
          all — let Opus run them once. Removes the poll-loop cause at the source.
      (B) STRUCTURAL (the durable guard the Governor asked for — 'protect from one running all night'):
          a CAL-native LOOP-STOPPER that does not depend on the looping agent policing itself.
          Research-grounded layered design (industry standard; the Governor's 10/20/30x-95/90/85%
          ladder was an explicit PLACEHOLDER — right SHAPE, numbers ~3-10x too loose, and it must be
          CONSECUTIVE-run not lifetime-tally): (1) CONSECUTIVE-repetition tripwire — exact/normalized
          (tool+args) signature repeated >=3 CONSECUTIVE times -> trip (the VERIFIED industry-standard
          stuck-signal: SWE-agent trajectory studies + Oracle agent-loop guidance both use 'same tool,
          same args, 3+ consecutive'); for fuzzy/reasoning loops, cosine >=0.85 (practical LoopDetector,
          max_consecutive=3) to >=0.97 (BERT observation-equivalence) or Jaccard >=0.75 (stagnant-
          reasoning), over a SHORT run — counter RESETS on genuine progress. A sustained-window variant
          (K~=15 consecutive similar steps) is the academic 'degenerative-repetition monitor' — a slower,
          different mechanism, not the fast stuck-catch. (2) NO-PROGRESS detector (STRONGEST for the
          all-night case, metric-free, deterministic) — git tree + target output unchanged across ~3-5
          actions -> trip, even if wording varies; this alone would have caught THIS incident. (3) HARD
          backstops — max iterations (tested 10-25) + max wall-clock (tested 30-60s; tune UP for CISEM's
          multi-minute checks) + token budget. (4) CONTEXT-TUNED BAR (Governor refinement 2026-07-26):
          the trip bar is NOT a global constant — it is set per OCCASION via a SMALL set of named context
          profiles (e.g. sync-check: bar=3; multi-tool research: bar~8 with wall-clock as primary;
          declared poll-with-backoff: exempt but hard-capped), because one global bar over-trips legit
          batch repetition (50 distinct-input reads = progress, not a loop) AND under-trips tight loops.
          BOTH signals tracked: 'same TYPE' (normalized action signature) AND 'same RAW output' (identical
          output blob). Lean-first: start with ~3 fixed profiles + safe defaults, NOT a learned system;
          the WEE later TUNES the bars from measured false-trip/missed-loop data (data-driven optimization
          is the DEEP phase, parked). EXTERNAL-WALL note (A12 + Principle 15): these are
          researched DEFAULTS, not CISEM-verified — they become 'verified for us' only after a trial run
          that MEASURES false-trips vs missed-loops on our own workload. Wiring: a Claude Code
          PostToolUse hook maintains the rolling signature log and, on trip, exits 2 with stderr
          'LOOP DETECTED — STOP and report' (that feedback reaches the model and breaks the loop);
          a SubagentStop/Stop hook + wall-clock backstop is the deterministic all-night catch.
          Similarity = normalized (tool_name + args) signature; near-identical = >=threshold match.
      MUST NOT be built before Brain consensus + a ratified plan (A4/A11 + the consensus-first
      process, RI-0043). This RI is the capture; the mechanism is a plan.
      BRAIN REFINE (cross-checked, ACCEPTED 2026-07-26): (a) NO-PROGRESS is AUTHORITATIVE, not a
      co-equal third layer — consecutive-signature match is only a cheap first-pass SCREEN; if the
      signature repeats but git tree/target-output genuinely CHANGED, do NOT trip (legit repeated
      check); if output is UNCHANGED even with varied wording, TRIP regardless of similarity score.
      No-progress OVERRIDES a similarity-only verdict in BOTH directions (it is the tiebreaker).
      (b) The exemption must NOT be self-certified — 'declared poll-with-backoff' relies on the
      agent's OWN claim (the forbidden self-grading anti-pattern). Tie the exemption to an OBJECTIVE
      hook-verifiable signal: a REAL backgrounded-Bash task handle on record; no real background job
      -> no exemption, whatever the agent asserts. (c) START with 3 profiles; do NOT add a 4th
      preemptively — instrument the trial to log every trip (real/false) per profile and let a 4th
      EMERGE from data (same over-engineering the WEE measured-capacity model already avoided).
      (d) the no-progress window (~3-5 actions) IS per-profile tunable (explicit decision), NOT
      global — a sync-check warrants a tighter window than multi-tool research. (e) add a 4th
      element per Brain's TIER-0 note: a rate-limited POLLING INTERVAL (a legit wait must back off,
      not hot-spin) as a distinct signal from repetition.
    routes_to:
      - "Brain consensus packet 2026-07-26 (loop-stopper deep design) -> ratified plan -> CAL PostToolUse/Stop hook build"
      - "WEE ARCH-00426 L5 auto-trigger — this loop-stopper is the safety rib for any all-night autonomous run (synergy, A9)"
      - "candidate RI for the weekly RIPL batch (runaway-guard class)"
    status: PROPOSED
