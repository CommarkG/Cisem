  RI-0025:
    date: "2026-07-23"
    trigger: "ARCH-00417's B1-fix (merging M1's measurement substrate into a registered enum-reconciliation prevention) survived FOUR reasoning passes — Opus solo Stage-1 verdict, Brain's merge PROPOSAL, and TWO Sonnet revisions — all reasoning from PARAPHRASES of ARCH-00011 §4. The GI-68 dual re-review caught it ONLY when cisem-sonnet READ ARCH-00011 §4 directly and found it explicitly states Wiring-State (DECLARED→CONNECTED→ACCESSIBLE→LIVE) is 'a SEPARATE dimension from lifecycle status' — the merge had conflated two distinct axes, and M1 still had no measurable substrate. Governor: 'park this for deep extraction and improval of core elements' (re: 'we caught it before ratifying, by reading the source instead of trusting the paraphrase')."
    root_insight: "CONSENSUS-LAUNDERING / PARAPHRASE-TRUST — the CONSENSUS-LAYER capstone of the plausibility-over-verification family (RI-0021 retrieval · RI-0022 synthesis · RI-0023 premise/title-vs-content). When multiple parties reach CONSENSUS on a claim about what an existing artifact SAYS or MEANS, and all reason from the same PARAPHRASE rather than the source text, the consensus FEELS like verification but adds only confidence, not source-contact. Each party trusts the prior's paraphrase; agreement amplifies conviction while the unverified claim propagates unchanged — consensus LAUNDERS a paraphrase into 'agreed truth.' This is precisely why the axis-conflation survived four passes plus explicit Opus+Brain agreement: not one of them re-read §4. PERMANENT COUNTER: for ANY claim about what an existing artifact says/means, at least ONE party must READ THE SOURCE and QUOTE it (not the paraphrase) before it is treated as verified — and HIGHER consensus owes MORE source-contact, not less, because agreement is exactly what suppresses the instinct to check. Generalizes RI-0023's 'verify CONTENT not TITLE' sub-trap to the whole class: title, paraphrase, and summary are all SURFACES; the source text is the GROUND. BINDS ALL FOUR (Opus, Sonnet, Haiku, Brain) — the failure lived in the consensus BETWEEN them, not in any one tier. Self-instance (poetic + literal): the plan ABOUT closing the wired-vs-claimed gap itself carried a claim-not-verified-against-source, caught by the exact GI-68 mechanism it motivated."
    routes_to: ["GI-68 dual-review protocol — MANDATE a source-read lens: any claim about what an existing artifact says/means is verified against the SOURCE TEXT (quoted), never the plan's paraphrase (exactly what caught RB1); ARCH-00190 §3 + /cisem-plan wizard", "ARCH-00190 plan-authoring — a plan claim about an existing artifact must QUOTE the source (file:line), not paraphrase it, so the claim is checkable against source (candidate mechanical [SOURCE-QUOTE] hint)", "CS-AI-PROFILING-001 persona — extend the RI-0021/22/23 anti-plausibility family: consensus on a paraphrase != verification; source-contact required, and consensus INCREASES the obligation to read source", "capstone/sibling to RI-0021 (retrieval) + RI-0022 (synthesis) + RI-0023 (premise) — the CONSENSUS layer of the same family"]
    status: NAMED — core insight extracted per Governor 'deep extraction' directive 2026-07-23; core-element improvements identified (GI-68 source-read lens + plan-authoring quote-the-source rule + persona-family extension); mechanical wiring routed, pending a plan
