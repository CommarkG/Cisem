  RI-0053:
    date: "2026-07-26"
    trigger: "Git-race: fired two background `git commit`s close together; because they share the ONE working-tree index, the second's `git add` (WITNESS) was swept into the FIRST's commit (0a4116f) rather than its own. Benign (WITNESS landed) but a real §1.7 violation."
    root_insight: >
      CONCURRENT-BACKGROUND-COMMIT RACE: background `git commit`s share the working-tree index; firing a second
      while the first is still running its (slow) pre-commit hook causes the second's `git add` to be bundled into
      the first's commit, or hits index.lock. PREVENTION: SERIALIZE — never fire a background commit while another
      is running; wait for the first's completion notification, then commit the next. §1.7 one-committer-at-a-time.
      (Wired into the WITNESS commit-discipline note this session.)
