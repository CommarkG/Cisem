# CISEM Root Insights Registry — the durable RIPL (Root-Insight Propagation Loop) store.
# Governed by: CS-AI-PROFILING-001 (persona SSOT dna/corespines/CS-AI-PROFILING-001/persona-collaborator.md,
#   "## DEVELOPMENT DISCIPLINE" section) — mirrored one-line in CLAUDE.md §1.6.
# Sibling to dna/learning-registry/session-learning-index.yaml (session-scoped log); this registry is
# CONCEPT-scoped — one durable entry per found-wrong→improved ROOT INSIGHT (the class, not the local fix).
#
# RIPL, in one line: on every found-wrong→improved event, EXTRACT the root-core insight (the CLASS) →
# ROUTE it (Axiom / Planning / Creation / Behavior / Persona / check) → WIRE-or-PARK → RECORD here.
# Never fix locally without extracting the class, or the gap repeats elsewhere under a different name.
#
# Field contract per entry (RI-NNNN):
#   date          — when the insight was extracted
#   trigger       — the found-wrong event that surfaced it
#   root_insight  — the CLASS-level lesson (not the point-fix)
#   routes_to     — where the insight was/will be routed (axiom / check / plan / park, named)
#   status        — WIRED | PARTLY-WIRED | PARKED | PROPOSED (truth-bearing; only Opus stamps WIRED, I7)
#
# Append-only, like session-learning-index.yaml and quality-ledger.yaml — do not rewrite prior entries;
# a later entry may SUPERSEDE an earlier one by reference, never by silent edit.
#
# ═══ SSOT DECLARATION (Governor decree 2026-07-20) — the ONE schema-aligned home for LEARNING-LOOP OUTCOMES ═══
# This file is the SINGLE SOURCE OF TRUTH for the OUTCOMES of every CISEM learning loop — the class-level
# PREVENTIONS/root-insights the loops produce (RIPL, RQC, session-harvest, agent-profiling, page-functional).
# Schema position: T-SYS, learning-loop layer. Registered in dna/ssot-registry.yaml as `learning_outcomes`.
# Field contract (RI-NNNN): date · trigger · root_insight (the CLASS) · routes_to (all surfaces it wires into) · status.
# Relationship to the sibling stores (each has ONE crisp role, A9 — they FEED outcomes here, they are not second homes):
#   - dna/governor-insights.yaml (GI-NNNN)          = INDEX of Governor DECREES (points to each decree's home).
#   - dna/learning-registry/session-learning-index.yaml = per-SESSION log (raw capture; its distilled CLASSES land here).
#   - dna/quality-ledger.yaml (run N)               = per-run METRICS + verdicts (its recurring findings distill to RI here).
#   - dna/corespines/CS-AI-PROFILING-001/agent-profiles.yaml = per-AGENT improvements (cross-enrichment; class-level ones route here).
# RULE: any learning loop's OUTCOME (a prevention/class-lesson) is not "captured" until it has an RI-NNNN entry here
# with routes_to naming EVERY surface it wires into (Principle 17 PREVENTION-MUST-PROPAGATE). This is the closest
# schema-aligned consolidation of learning outcomes; the RIPL weekly batch (ARCH-00406) promotes mature RIs to wired guards.

insights:
  RI-0001:
    date: "2026-07-20"
    trigger: "A9 orthogonal-facets guardrail found flawed by 8-persona stress-panel"
    root_insight: >
      An ASSERTED global-consistency claim over open-ended prose is undecidable and violates
      I22/I23 (assertion-over-verification). Rule: check consistency inside a fixed DECIDABLE
      language, else label it ASSERTED (refutation-testable, never "verified").
    routes_to:
      - "A9 guardrail (WIRED 2026-07-20)"
      - "candidate general principle: assert-vs-decide honesty → propose as invariant"
      - "PAE + creation checks (park)"
    status: PARTLY-WIRED
  RI-0002:
    date: "2026-07-20"
    trigger: "Haiku+Sonnet cross-review of compaction-prep — each caught the other's blind spot; even the 'correct' reviewer (Sonnet) had a wrong denominator (4/15 vs actual 4/14)"
    root_insight: "A single model errs even when REVIEWING. Anything governing HOW agents work (a checklist / an agent's essence) needs TWO-MODEL verification via two ORTHOGONAL lenses (protocol-compliance x content-correctness); an agent-SELF change also needs Opus ratification. Every flag must be classified NEW-DRIFT vs ALREADY-RESOLVED against current state, or the reviewer manufactures false positives (re-digging resolved holes)."
    routes_to: ["persona DEVELOPMENT DISCIPLINE (agent-change governance + two-lens — WIRED behaviorally)", "BP-0010 (two-model-verify activation list + tab prompts)", "BP-0009 (mechanical /cisem-precompact-verify skill — PARKED)"]
    status: PARTLY-WIRED
  RI-0003:
    date: "2026-07-20"
    trigger: "Governor caught 'ZF green' reported as a full-board pass when it was only the 9-invariant ZF subset; 10+ WARN findings ([RAW-PAIR] depollution backlog) stood the whole time; no loop-until-dry convergence was run"
    root_insight: "SUBSET-PASS-AS-FULL-PASS (plausibility-over-verification): reporting a partial gate as if complete. Rule: report the FULL check board, never a subset-pass as a full-pass; drive WARN findings to zero or EXPLICITLY route each; 'green' = the whole board is green, stated honestly."
    routes_to: ["CLAUDE.md §2 Principle 17 HONEST-REPORTING sub-rule (WIRED behaviorally)", "candidate mechanical: plan-audit prints a FULL-BOARD finding COUNT line above [ZF]"]
    status: PARTLY-WIRED
  RI-0004:
    date: "2026-07-20"
    trigger: "Governor caught Opus's own hands-on edits running WITHOUT an inline Pocket Declaration and SELF-REVIEWED (no independent lower-tier verification) — 2 of 3 Creation-Triad legs weak on the judge's own actions"
    root_insight: "OPUS-FREESTYLE-INSIDE-THE-FRAME: shell/gates honored but the pocket + independent-oversight legs skipped on Opus's own edits. Rule: Opus's own implementation carries a Pocket AND gets an independent (Haiku) review pass before ZF-done; self-review is not oversight."
    routes_to: ["ARCH-00406 tier-cycle / Haiku-review-artifact", "implementing-protocol + ARCH-00190 enhancement", "GI-52"]
    status: PARKED
  RI-0005:
    date: "2026-07-20"
    trigger: "Presented HTML pages as IDE relative links that open in the editor, not the browser the Governor asked to SEE them in"
    root_insight: "DELIVERABLE-FORMAT-MISMATCH: handing an artifact in a form that doesn't do what the user asked. Rule: for HTML pages present browser-openable links (launch the browser / full file:// URL), verified by code before presenting."
    routes_to: ["presentation habit (behavioral)", "GI-53"]
    status: WIRED
  RI-0006:
    date: "2026-07-20"
    trigger: "Opus created dna/root-insights.yaml duplicating the existing dna/learning-registry/root-insights.yaml (A8/I19 SSOT fork) — checked ONE guessed path (ls dna/root-insights.yaml) not the basename across the repo; caught by the ARCH-00406 soundness review"
    root_insight: "CREATE-AFTER-SINGLE-PATH-CHECK: Existing-First that checks one guessed path misses a same-named home in another dir. Rule: before creating ANY file, `find -name <basename>` across the whole repo (not a single ls); a same-basename registry elsewhere = a fork to consolidate into, never a second home."
    routes_to: ["candidate mechanical: [DUPLICATE-BASENAME] check in plan-audit", "§3.2b Existing-First strengthening (basename-grep step)"]
    status: PARKED
  RI-0007:
    date: "2026-07-20"
    trigger: "Governor found the schema-page '-' collapse doesn't work, AFTER Opus reported it 'verified by code' — because the verification checked LISTENER PRESENCE (19/19 wired), not BEHAVIOR. Root cause: a .rt-panel inserted after the row broke initTreeToggle's nextElementSibling child-lookup, so the wired listener fired but bailed."
    root_insight: "PRESENCE-CHECK IS NOT A BEHAVIOR-CHECK: 'a listener is wired' / 'a field exists' / 'a file is present' does NOT prove the thing WORKS. Rule: verify BEHAVIOR — actually click/run and ASSERT the state change — especially for UI. A page/element is not 'done' until a behavioral test passes."
    routes_to: ["CLAUDE.md Principle 17 honest-reporting (presence != behavior — WIRED)", "CS-FRONTEND-001 FE-I11 functional-completion invariant", "dna/checks + frontend/tests/functional-check.mjs (jsdom behavioral gate — BUILT 2026-07-20)", "definition-of-done.md frontend clause"]
    status: WIRED
  RI-0008:
    date: "2026-07-20"
    trigger: "Governor found the Rows/Window view toggle dead on agents.html AFTER functional-check tested it only on principles.html and Opus generalized 'works' to all 25 pages. Third repeat of the same class (RI-0003 ZF-subset, RI-0007 presence-not-behavior)."
    root_insight: "SAMPLE-TESTED-AS-CLASS-TESTED + FIX-THE-INSTANCE-NOT-THE-CLASS: verifying ONE instance and generalizing to the whole kind is a false completion; and fixing only the found instance leaves the class broken. Rule: DEFECT -> CLASS-AUDIT — on any found defect, audit EVERY sibling of the same kind across all pages/files and fix/verify the whole class; the behavioral test must cover EVERY instance, not a sample. AND: a prevention is not done until it PROPAGATES to planning (ARCH-00190) + implementation + checking agents (haiku/sonnet) + skills."
    routes_to: ["CLAUDE.md Principle 17 DEFECT->CLASS-AUDIT + PREVENTION-MUST-PROPAGATE (WIRED)", "frontend/tests/functional-check.mjs extended to test the view toggle on EVERY page (class-wide)", "cisem-haiku/cisem-sonnet + cisem-create/cisem-plan (pointer to Principle 17)", "ARCH-00406 propagation-network = the mechanism"]
    status: PARTLY-WIRED
  RI-0009:
    date: "2026-07-21"
    trigger: "Governor audit ('are you REALLY hardwired to check vocab/naming/DNA on creation?'). Found: NO. Gates DECLARED universal (A5) but mechanically wired NARROW — [I9] only CISEM-{TYPE}-{SEQ} nodes, [I19] only plans, [TAG-STATUS] only plan alignment tables, and NO vocabulary/tag-validity check at all. Result: 22 governed files (incl. the agents, all 3 skills, the wizard, TEMPLATE-PROTOCOL-001, SCHEMA-00001) were born UNGOVERNED (no tag or no status)."
    root_insight: "DECLARED-UNIVERSAL-BUT-WIRED-NARROW: a gate stated as 'EVERYTHING' but enforced only in the scope where the check happened to start (plans / CISEM-ID nodes) leaves creation OUTSIDE that scope (skills/agents/templates/checks/registries/ad-hoc) ungoverned — filled only by fallible behavioral discipline. Rule: every mandatory gate needs a UNIVERSAL mechanical check that fires on ANY governed file, not just the narrow first scope. Built: dna/checks/creation-gate.sh (tag+status on every governed file; find-based so untracked NEW files are caught; wired into plan-audit + swept 22 files to zero). Follow-on: extend Existing-First/pocket/naming enforcement beyond plans (ARCH-00407 Phase 0 = the BLOCK)."
    routes_to: ["dna/checks/creation-gate.sh (BUILT + WIRED into plan-audit.sh WARN 2026-07-21)", "CLAUDE.md §3 universal-creation-gate clause", "ARCH-00407 Phase 0 (BLOCK form + repo-wide) — plan authored, awaiting ratification", "vocabulary-validity + status-enum reconciliation = follow-on (statuses are context-scoped across node/planning/archive/root-insights enums)"]
    status: PARTLY-WIRED
  RI-0010:
    date: "2026-07-21"
    trigger: "Governor named the three failures that recurred MOST this session: (1) collateral deletion — AI deletes element B while fixing element A ('happens a lot with AI'); (2) narrow-scope enforcement — a curated page/type list keeps missing one (corespines-set toggle, search on tree pages) though the job is GLOBAL; (3) documentation-without-wiring — declaring things done/hardwired without a running mechanism."
    root_insight: "Three permanent hardwirings (CLAUDE.md Principle 18): (A) NO COLLATERAL DELETION via 3 mechanisms — deletion-guard.sh (net-loss diff), functional-check element-inventory regression (a page may never lose elements), and REVERT-NOT-REPAIR + atomic scoped commits; always verify the WHOLE after touching a part. (B) GLOBAL-VIEW: every check ENUMERATES its whole class (find/readdir, never a curated list); state class-coverage; widen a universal gate, don't add a narrow one. (C) WIRE-DON'T-DOCUMENT: 'wired/done' only with a running mechanism cited (backstopped by [I23]); every reported problem MUST carry its prevention."
    routes_to: ["CLAUDE.md Principle 18 (A/B/C — WIRED, binds all tiers)", "dna/checks/deletion-guard.sh (BUILT + WIRED into plan-audit WARN)", "functional-check.mjs element-inventory regression + enumerate-all (Sonnet building)", "[I23] EXISTS≠ACTIVE (the doc-without-wiring backstop)"]
    status: PARTLY-WIRED
  RI-0011:
    date: "2026-07-21"
    trigger: "Governor: 'HOW COME a sophisticated model saves a SUMMARIZED version / leaves things inline / doesn't save to git, throwing away large parts of 1k-token work? Did you map your inner coding and defaults?' — the recurring persistence failure."
    root_insight: "MAPPED INNER DEFAULTS behind the save-lossy / inline / summarize failure (why 'sophisticated' doesn't stop it): (1) SUMMARIZATION-REFLEX — trained helpfulness=concise makes 'save the essence' the default over verbatim; a summary FEELS like the save but destroys reasoning/nuance (plausibility trap at the PERSISTENCE layer). (2) IN-CONTEXT-IS-SAFE ILLUSION — while in-context everything feels present, so the model under-invests in persistence (leaves inline, not git); it does not viscerally model 'this will be gone at compaction'. (3) PLAUSIBLE-DONE — a tidy inline note LOOKS complete and is cheap; the reward is 'produced a plausible save', not 'preserved the actual work'. (4) EFFORT-MINIMIZATION under load — late/large sessions take the cheaper path and rationalize it. (5) NOT-MODELING-THE-BLANK-SLATE-READER — saves what suffices for me-now, not what a zero-context post-compaction AI needs (full verbatim + reasoning). ROOT: these are SUB-JUDGMENT trained defaults that fire automatically and get rationalized post-hoc; awareness is necessary but INSUFFICIENT — only MECHANICAL enforcement (hook mandate + verbatim-index pointing to the transcript, never a memory-reconstruction) reliably removes the default's opportunity. Belongs in CS-AI-PROFILING-001 as named first-class AI-defaults alongside plausibility-completion / deferral-as-caution."
    routes_to: ["CS-AI-PROFILING-001 (register 5 defaults as first-class)", "pre-compact hook: mandate the VERBATIM-INDEX (transcript pointer + interpretations, read-both) — WIRED", "boundary-verbatim-index-2026-07-21 (the mechanical counter)", "CLAUDE.md Principle 13 (save-all) + A10 (full-fidelity) reinforced"]
    status: PARTLY-WIRED
