    root_insight: "DELIVERABLE-FORMAT-MISMATCH: handing an artifact in a form that doesn't do what the user asked. Rule: for HTML pages present browser-openable links (launch the browser / full file:// URL), verified by code before presenting."
    routes_to: ["presentation habit (behavioral)", "GI-53"]
    status: WIRED
  RI-0006:
    date: "2026-07-20"
    trigger: "Opus created dna/root-insights.yaml duplicating the existing dna/learning-registry/root-insights.yaml (A8/I19 SSOT fork) — checked ONE guessed path (ls dna/root-insights.yaml) not the basename across the repo; caught by the ARCH-00406 soundness review"
    root_insight: "CREATE-AFTER-SINGLE-PATH-CHECK: Existing-First that checks one guessed path misses a same-named home in another dir. Rule: before creating ANY file, `find -name <basename>` across the whole repo (not a single ls); a same-basename registry elsewhere = a fork to consolidate into, never a second home."
    routes_to: ["candidate mechanical: [DUPLICATE-BASENAME] check in plan-audit", "§3.2b Existing-First strengthening (basename-grep step)"]
    status: PARKED
  RI-0007:
    date: "2026-07-20"
    trigger: "Governor found the schema-page '-' collapse doesn't work, AFTER Opus reported it 'verified by code' — because the verification checked LISTENER PRESENCE (19/19 wired), not BEHAVIOR. Root cause: a .rt-panel inserted after the row broke initTreeToggle's nextElementSibling child-lookup, so the wired listener fired but bailed."
    root_insight: "PRESENCE-CHECK IS NOT A BEHAVIOR-CHECK: 'a listener is wired' / 'a field exists' / 'a file is present' does NOT prove the thing WORKS. Rule: verify BEHAVIOR — actually click/run and ASSERT the state change — especially for UI. A page/element is not 'done' until a behavioral test passes."
    routes_to: ["CLAUDE.md Principle 17 honest-reporting (presence != behavior — WIRED)", "CS-FRONTEND-001 FE-I11 functional-completion invariant", "dna/checks + frontend/tests/functional-check.mjs (jsdom behavioral gate — BUILT 2026-07-20)", "definition-of-done.md frontend clause"]
    status: WIRED
  RI-0008:
    date: "2026-07-20"
    trigger: "Governor found the Rows/Window view toggle dead on agents.html AFTER functional-check tested it only on principles.html and Opus generalized 'works' to all 25 pages. Third repeat of the same class (RI-0003 ZF-subset, RI-0007 presence-not-behavior)."
    root_insight: "SAMPLE-TESTED-AS-CLASS-TESTED + FIX-THE-INSTANCE-NOT-THE-CLASS: verifying ONE instance and generalizing to the whole kind is a false completion; and fixing only the found instance leaves the class broken. Rule: DEFECT -> CLASS-AUDIT — on any found defect, audit EVERY sibling of the same kind across all pages/files and fix/verify the whole class; the behavioral test must cover EVERY instance, not a sample. AND: a prevention is not done until it PROPAGATES to planning (ARCH-00190) + implementation + checking agents (haiku/sonnet) + skills."
    routes_to: ["CLAUDE.md Principle 17 DEFECT->CLASS-AUDIT + PREVENTION-MUST-PROPAGATE (WIRED)", "frontend/tests/functional-check.mjs extended to test the view toggle on EVERY page (class-wide)", "cisem-haiku/cisem-sonnet + cisem-create/cisem-plan (pointer to Principle 17)", "ARCH-00406 propagation-network = the mechanism"]
    status: PARTLY-WIRED
